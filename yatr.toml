# yatr - https://github.com/cargopete/yatr
#
# Task names are the same across every nightswatchhq repo, so `yatr ci` means
# the same thing wherever you are. Note that `ci` is deliberately not called
# `check`: `yatr check` is a builtin that validates this file, and it shadows
# any task of that name without warning.

[env]
RUST_BACKTRACE = "1"

[settings]
cache = true

[tasks.fmt]
desc = "Format the tree"
run = ["cargo fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted"
run = ["cargo fmt --all -- --check"]
sources = ["src/**/*.rs", "examples/**/*.rs"]

[tasks.lint]
desc = "Clippy with warnings denied"
run = ["cargo clippy --all-targets -- -D warnings"]
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]

[tasks.test]
desc = "Run the test suite"
run = ["cargo test"]
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]
watch = ["src/**/*.rs"]

[tasks.smoke]
desc = "The repo's own end-to-end script (needs a reachable amp server)"
run = ["./test.sh"]
no_cache = true

[tasks.build]
desc = "Build in release mode"
run = ["cargo build --release"]
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]

[tasks.ci]
desc = "What CI runs: fmt-check, lint, test"
depends = ["fmt-check", "lint", "test"]
run = []
